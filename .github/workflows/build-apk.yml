name: Build APK

on:
  push:
    branches:
      - main
      - 'claude/**'
      - japanese-search-readings
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Product flavor to build'
        type: choice
        default: 'default'
        options:
          - default
          - fdroid
      build_type:
        description: 'Build type to build'
        type: choice
        default: 'debug'
        options:
          - debug
          - release

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve build variant
        id: variant
        env:
          FLAVOR: ${{ inputs.variant || 'default' }}
          BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
        run: |
          capitalize() { echo "$(echo "${1:0:1}" | tr '[:lower:]' '[:upper:]')${1:1}"; }
          # The build date, plus a two digit run counter so that two builds on the same day
          # still differ. Keeps the scheme (and the order) of the hard coded default in
          # app/app/build.gradle.kts, and stays well below the 2147483647 an Int can hold.
          {
            echo "flavor=${FLAVOR}"
            echo "build_type=${BUILD_TYPE}"
            echo "task=assemble$(capitalize "${FLAVOR}")$(capitalize "${BUILD_TYPE}")"
            echo "version_code=$(date -u +%Y%m%d)$(printf '%02d' $((GITHUB_RUN_NUMBER % 100)))"
            echo "version_suffix=-${GITHUB_SHA:0:7}"
          } >> "$GITHUB_OUTPUT"

      # Without a keystore the build falls back to the debug key the runner generates, which
      # is a different key on every run, so each APK refuses to install over the one before it.
      - name: Decode signing keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -z "${KEYSTORE}" ]; then
            echo "::notice title=Unsigned build::No KEYSTORE secret is set. This APK is signed with a throwaway key and will not install over an earlier build."
            exit 0
          fi
          mkdir -p "${RUNNER_TEMP}/keystore"
          printf '%s' "${KEYSTORE}" | base64 -di > "${RUNNER_TEMP}/keystore/keystore.jks"

      - name: Build APK
        env:
          VERSION_CODE_OVERRIDE: ${{ steps.variant.outputs.version_code }}
          VERSION_NAME_SUFFIX: ${{ steps.variant.outputs.version_suffix }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew ${{ steps.variant.outputs.task }} --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kvaesitso-${{ steps.variant.outputs.flavor }}-${{ steps.variant.outputs.build_type }}-${{ github.sha }}
          path: app/app/build/outputs/apk/${{ steps.variant.outputs.flavor }}/${{ steps.variant.outputs.build_type }}/*.apk
          if-no-files-found: error

      # Runs after the upload, so that a failing test still leaves a downloadable APK behind.
      - name: Run unit tests
        run: ./gradlew :core:base:testDebugUnitTest :core:ktx:testDebugUnitTest :data:locations:testDebugUnitTest --stacktrace

      # Annotations are readable without signing in, unlike the log and the artifacts, which
      # is what makes a failure here diagnosable from the outside.
      - name: Annotate failing tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET

          failures = 0
          for path in glob.glob('**/build/test-results/**/*.xml', recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter('testcase'):
                  for problem in list(case.iter('failure')) + list(case.iter('error')):
                      message = (problem.get('message') or problem.text or '').strip()
                      message = message.replace('%', '%25')
                      message = '%0A'.join(message.splitlines())[:1500]
                      title = '%s.%s' % (case.get('classname'), case.get('name'))
                      print('::error title=%s::%s' % (title, message))
                      failures += 1
          print('%d failing test(s)' % failures)
          PY

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
